[project]
name = "ph-monitor-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "paho-mqtt>=2.1,<3", "bleak>=1,<3", "dbus-fast>=2.24,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "database", "mqtt_bridge", "ble_provision", "pi_wifi", "ph_calibration", "main"]
